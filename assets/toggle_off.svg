<svg xmlns="http://www.w3.org/2000/svg" width="72" height="32" viewBox="0 0 72 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trackOff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <radialGradient id="knobOff" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="60%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </radialGradient>
  </defs>
  <!-- Track -->
  <rect x="1" y="1" width="70" height="30" rx="15" ry="15" fill="url(#trackOff)" stroke="#555" stroke-width="1.5"/>
  <!-- Knob (left side = OFF) -->
  <circle cx="16" cy="16" r="11" fill="url(#knobOff)" stroke="#777" stroke-width="1"/>
  <!-- OFF text -->
  <text x="48" y="20" font-family="Arial" font-size="10" font-weight="bold" fill="#666" text-anchor="middle">OFF</text>
</svg>
