<svg xmlns="http://www.w3.org/2000/svg" width="72" height="32" viewBox="0 0 72 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trackOn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <radialGradient id="knobOn" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#e0ffe0"/>
      <stop offset="60%" stop-color="#b9f6ca"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </radialGradient>
  </defs>
  <!-- Track -->
  <rect x="1" y="1" width="70" height="30" rx="15" ry="15" fill="url(#trackOn)" stroke="#00e676" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Knob (right side = ON) -->
  <circle cx="56" cy="16" r="11" fill="url(#knobOn)" stroke="#00e676" stroke-width="1" filter="url(#glow)"/>
  <!-- ON text -->
  <text x="22" y="20" font-family="Arial" font-size="11" font-weight="bold" fill="#e0ffe0" text-anchor="middle">ON</text>
</svg>
